<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Адрес доставки — EVOL</title>
  <link rel="icon" href="img/logo-2.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="panel">
  <div class="panel__icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/></svg></div>
  <h1 class="panel__title">Адрес доставки</h1>
  <form data-address data-next="catalog.html" data-save="city,street,flat,floor,intercom,comment">
    <label class="field">
      <span class="field__label">Город</span>
      <input class="field__input" name="city" type="text" placeholder="к сожалению, сейчас доступен только один город" required >
    </label>
    <label class="field">
      <span class="field__label">Улица / дом</span>
      <input class="field__input" name="street" type="text" placeholder="введите вашу улицу и дом" required >
    </label>
    <label class="field">
      <span class="field__label">Квартира</span>
      <input class="field__input" name="flat" type="text" placeholder="введите номер квартиры" required >
    </label>
    <label class="field">
      <span class="field__label">Этаж</span>
      <input class="field__input" name="floor" type="text" placeholder="введите этаж" required >
    </label>
    <label class="field">
      <span class="field__label">Домофон</span>
      <input class="field__input" name="intercom" type="text" placeholder="домофон" >
    </label>
    <label class="field">
      <span class="field__label">Комментарий</span>
      <input class="field__input" name="comment" type="text" placeholder="оставьте комментарий">
    </label>
    <p class="form-error" id="error" role="alert" hidden></p>
    <button class="btn" type="submit">Сохранить</button>
  </form>
</main>
<script type="module" src="js/forms.js"></script>
</body>
</html>
