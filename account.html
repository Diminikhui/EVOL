<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный кабинет — EVOL</title>
  <link rel="icon" href="img/logo-2.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="header">
  <a href="catalog.html"><img class="header__logo" src="img/logo-2.svg" alt="EVOL"></a>
  <a class="header__account" href="account.html" aria-label="Личный кабинет"><img src="img/person.svg" alt=""></a>
</header>
<main class="account">
  <section class="panel">
    <div class="panel__icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/></svg></div>
    <h1 class="panel__title" id="name"></h1>
  </section>
  <section class="panel">
    <h2 class="panel__title">Статус заказа</h2>
    <p class="status" id="status"></p>
  </section>
  <section class="panel">
    <h2 class="panel__title">Бонусы</h2>
    <p class="bonus-balance" id="bonus-balance"></p>
    <p class="empty-hint" id="bonus-hint"></p>
  </section>
  <section class="panel">
    <h2 class="panel__title">Заказы</h2>
    <div id="orders"></div>
  </section>
  <section class="panel">
    <h2 class="panel__title">Избранное</h2>
    <div id="favorites"></div>
  </section>
  <section class="panel">
    <h2 class="panel__title">Мои адреса</h2>
    <div id="addresses"></div>
    <a class="btn btn--outline btn--sm add-address" href="address.html">+ Добавить адрес</a>
  </section>
  <section class="panel" id="logout-box" hidden>
    <h2 class="panel__title">Аккаунт</h2>
    <button class="btn btn--outline" type="button" id="logout">Выйти</button>
  </section>
  <section class="panel">
    <h2 class="panel__title">Уведомления</h2>
    <label class="switch">
      <input type="checkbox" id="notify-toggle">
      <span>Сообщать о смене статуса заказа</span>
    </label>
    <p class="empty-hint" id="notify-hint"></p>
  </section>
</main>
<script type="module" src="js/account.js"></script>
</body>
</html>
